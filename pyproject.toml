[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
markers = [
  "integration: nécessite les services Compose démarrés",
  "gpu: nécessite PyTorch CUDA et un GPU NVIDIA",
]
addopts = "-ra"
