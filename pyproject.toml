[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend", "workers/vision"]
markers = [
  "ml: dépendances PyTorch/timm facultatives, testable sur CPU",
  "integration: nécessite les services Compose démarrés",
  "gpu: nécessite PyTorch CUDA et un GPU NVIDIA",
  "real_model: intégration facultative avec vidéo locale et modèles réels",
]
addopts = "-ra -m 'not integration and not gpu and not real_model'"
