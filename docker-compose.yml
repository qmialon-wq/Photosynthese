name: ${COMPOSE_PROJECT_NAME:-biosentinelle}

x-python-environment: &python-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-biosentinelle}
  POSTGRES_USER: ${POSTGRES_USER:-biosentinelle}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biosentinelle_local}
  REDIS_URL: redis://redis:6379/0
  STORAGE_ROOT: /storage
  TORCH_HOME: /storage/models/cache/torch
  HF_HOME: /storage/models/cache/huggingface
  XDG_CACHE_HOME: /storage/models/cache
  WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-5}
  WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-30}

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 8s
  retries: 6
  start_period: 20s

services:
  storage-init:
    image: python:3.12.12-slim-bookworm
    network_mode: none
    volumes:
      - ${DATA_ROOT:-./data}:/storage
      - ./infra/init_storage.py:/init_storage.py:ro
    command: ["python", "/init_storage.py"]
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biosentinelle}
      POSTGRES_USER: ${POSTGRES_USER:-biosentinelle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biosentinelle_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [services]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [services]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped

  migrate:
    image: biosentinelle/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment: *python-environment
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    networks: [services]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: biosentinelle/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment: *python-environment
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${DATA_ROOT:-./data}/datasets:/storage/datasets:ro
      - ${DATA_ROOT:-./data}/models:/storage/models:ro
      - ${DATA_ROOT:-./data}/checkpoints:/storage/checkpoints:ro
      - ${DATA_ROOT:-./data}/documents:/storage/documents
      - ${DATA_ROOT:-./data}/results:/storage/results
    networks: [web, services]
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=6)"]
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
    restart: unless-stopped

  vision:
    build:
      context: .
      dockerfile: workers/vision/Dockerfile
      target: cpu
    environment:
      <<: *python-environment
      REQUIRE_CUDA: "0"
      BIOSENTINELLE_VISION_DATASET_ROOT: /storage/datasets
      BIOSENTINELLE_VISION_OUTPUT_ROOT: /storage/results/vision
      BIOSENTINELLE_VISION_CHECKPOINT_ROOT: /storage/checkpoints
      BIOSENTINELLE_VISION_GPU_LOCK_PATH: /storage/results/.vision-gpu.lock
      BIOSENTINELLE_VISION_DEVICE: ${VISION_DEVICE:-cpu}
    volumes:
      - ${DATA_ROOT:-./data}/datasets:/storage/datasets
      - ${DATA_ROOT:-./data}/models:/storage/models
      - ${DATA_ROOT:-./data}/checkpoints:/storage/checkpoints
      - ${DATA_ROOT:-./data}/results:/storage/results
    networks: [services]
    depends_on:
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-m", "shared.worker_health", "vision"]
    # Consommateur unique activé explicitement par le fichier Compose ML.
    deploy:
      replicas: 1
    restart: unless-stopped
    init: true

  detector-download:
    profiles: [tools]
    build:
      context: .
      dockerfile: workers/vision/Dockerfile
      target: cpu
    environment:
      BIOSENTINELLE_VISION_DETECTOR_WEIGHTS: /storage/models/md_v5a.0.0.pt
    volumes:
      - ${DATA_ROOT:-./data}/models:/storage/models
    networks: [web]
    command: ["biosentinelle-vision", "detector-fetch"]
    restart: "no"

  documents:
    build:
      context: .
      dockerfile: workers/documents/Dockerfile
    environment:
      <<: *python-environment
      BIOSENTINELLE_DOCUMENTS_CONTACT_EMAIL: ${DOCUMENTS_CONTACT_EMAIL:-}
      BIOSENTINELLE_DOCUMENTS_OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      BIOSENTINELLE_DOCUMENTS_REQUEST_INTERVAL: ${DOCUMENTS_REQUEST_INTERVAL:-1}
      BIOSENTINELLE_DOCUMENTS_CACHE_TTL_SECONDS: ${DOCUMENTS_CACHE_TTL_SECONDS:-86400}
      BIOSENTINELLE_RAG_MODEL_ROOT: /storage/models/rag
      BIOSENTINELLE_RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.80}
      BIOSENTINELLE_RAG_THREADS: ${RAG_THREADS:-2}
      BIOSENTINELLE_RAG_MODEL_MANIFEST: ${RAG_MODEL_MANIFEST:-}
      BIOSENTINELLE_RAG_GENERATION_ENABLED: ${RAG_GENERATION_ENABLED:-true}
      BIOSENTINELLE_RAG_GENERATOR_URL: ${RAG_GENERATOR_URL:-http://ollama:11434}
      BIOSENTINELLE_RAG_GENERATOR_MODEL: ${RAG_GENERATOR_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      BIOSENTINELLE_RAG_GENERATOR_TIMEOUT: ${RAG_GENERATOR_TIMEOUT:-600}
      BIOSENTINELLE_RAG_GENERATION_DEVICE: ${RAG_GENERATION_DEVICE:-cpu}
    volumes:
      - ${DATA_ROOT:-./data}/documents:/storage/documents
      - ${DATA_ROOT:-./data}/results:/storage/results
      - ${DATA_ROOT:-./data}/models:/storage/models
    networks: [services, web]
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-m", "shared.worker_health", "documents"]
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 2
    deploy:
      replicas: 1

  ollama:
    profiles: [rag-generation]
    image: ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ${DATA_ROOT:-./data}/models/ollama:/root/.ollama
    networks: [services, web]
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      <<: *python-environment
      BASE_URL: http://backend:8000
      FRONTEND_URL: http://frontend
    networks: [web, services]
    restart: "no"

networks:
  web:
  services:
    internal: true

volumes:
  postgres-data:
  redis-data:
