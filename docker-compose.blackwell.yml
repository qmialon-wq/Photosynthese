# Fusionner après gpu.yml et ml.yml pour les RTX 50 (CUDA 12.8).
services:
  vision:
    image: biosentinelle/vision-blackwell:local
    build:
      target: ml
      args:
        PYTORCH_IMAGE: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime@sha256:c16f4c749e2d9e96878875cdf6cc45cddda1d1a36fddd371dd6f2360f1b6e2a2
        ML_REQUIREMENTS: workers/vision/requirements-ml-blackwell.txt
