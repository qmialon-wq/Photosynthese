<!doctype html><html lang="fr"><meta charset="utf-8"><title>Revue locale des modèles 3D</title><style>body{background:#182820;color:#fff;font:14px system-ui}main{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}canvas{width:100%;display:block}article{background:#91a090;padding:10px;color:#14251a}</style><h1>Modèles fournis — contrôle de pose et d'axes</h1><main></main><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
for(const name of ['tree-near','grass-medium','fern_02','buse','pigeon','poisson','sanglier','chevreuil']){
const article=document.createElement('article');article.innerHTML=`<h2>${name}</h2>`;document.querySelector('main').append(article);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(440,330);renderer.toneMapping=T.ACESFilmicToneMapping;article.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#91a090');scene.add(new T.HemisphereLight('#fff','#394833',2.5));const light=new T.DirectionalLight('#fff',3);light.position.set(3,6,4);scene.add(light);const gltf=await new GLTFLoader().loadAsync('/experience-models/'+name+'.glb');scene.add(gltf.scene);const b=new T.Box3().setFromObject(gltf.scene),s=b.getSize(new T.Vector3()),center=b.getCenter(new T.Vector3());gltf.scene.position.sub(center);const span=Math.max(s.x,s.y,s.z),camera=new T.PerspectiveCamera(40,440/330,.01,1000);camera.position.set(span*1.1,span*.5,span*1.5);camera.lookAt(0,0,0);const controls=new OrbitControls(camera,renderer.domElement);controls.addEventListener('change',()=>renderer.render(scene,camera));renderer.render(scene,camera);article.dataset.dimensions=JSON.stringify(s);article.dataset.ready='true';const caption=document.createElement('p');caption.textContent=`x ${s.x.toFixed(2)} / y ${s.y.toFixed(2)} / z ${s.z.toFixed(2)}`;article.append(caption);
}
</script></html>
